#pg005-activity .pg5-page{position:relative;width:100%;aspect-ratio:828/1133;container-type:inline-size;background:#fff;user-select:none;-webkit-user-select:none}
#pg005-activity .pg5-band{position:absolute;left:0;width:100%;margin:0;display:flex;align-items:center;gap:1.4cqw;padding-left:1.1cqw;box-sizing:border-box;font-weight:400;color:#000;font-size:4.4cqw;line-height:1;white-space:nowrap;overflow:hidden}
#pg005-activity .pg5-frame{position:absolute;left:0;width:100%;box-sizing:border-box;border:.24cqw solid;background:#fff}
#pg005-activity .pg5-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
#pg005-activity .pg5-lines path{stroke:#0ea5e9;stroke-width:5;fill:none;stroke-linecap:round}
#pg005-activity .pg5-lines path.is-wrong{stroke:#dc2626}
#pg005-activity .pg5-item{position:absolute;z-index:3;margin:0;padding:0;border:0;background:transparent;overflow:hidden;cursor:pointer;border-radius:1.6cqw;-webkit-tap-highlight-color:transparent;font:inherit}
#pg005-activity .pg5-item:focus-visible{outline:.5cqw solid #1d4ed8;outline-offset:.2cqw;overflow:visible}
#pg005-activity .pg5-item.is-selected{box-shadow:inset 0 0 0 .5cqw #0ea5e9;background:rgba(14,165,233,.12)}
#pg005-activity .pg5-item.is-paired{background:rgba(14,165,233,.08)}
#pg005-activity .pg5-art{display:block;pointer-events:none;mix-blend-mode:multiply;max-width:none}
#pg005-activity .pg5-canvas{pointer-events:auto;cursor:pointer}
#pg005-activity .pg5-fb{position:absolute;top:0;right:0;width:3.4cqw;min-width:22px;height:3.4cqw;min-height:22px;display:none;align-items:center;justify-content:center;font-size:3.2cqw;line-height:1;z-index:7;pointer-events:none}
#pg005-activity .pg5-fb.ok{display:flex;color:#16a34a}
#pg005-activity .pg5-fb.bad{display:flex;color:#dc2626}
#pg005-activity .pg5-fb i{background:#fff;border-radius:9999px}
#pg005-activity .pg5-vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
#pg005-activity button.pg5-vh:focus{width:auto;height:auto;margin:0;clip:auto;background:#fff;color:#000;border:2px solid #1d4ed8;border-radius:6px;padding:6px 10px;z-index:20;font-size:16px}
#pg005-activity .pg5-tools{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
#pg005-activity .pg5-swatches{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#pg005-activity .pg5-swatch{width:44px;height:44px;border-radius:9999px;border:3px solid #fff;box-shadow:0 0 0 1px #9ca3af;cursor:pointer;padding:0}
#pg005-activity .pg5-swatch[aria-pressed="true"]{box-shadow:0 0 0 3px #111}
#pg005-activity .pg5-hint{margin:0;font-size:.95rem;color:#4b5563;text-align:center;min-height:1.2rem}
#pg005-activity .pg5-status{margin:0;min-height:1.5rem;font-weight:700;text-align:center;color:#b91c1c}
#pg005-activity .pg5-btn{min-height:44px;padding:8px 16px;border:2px solid #c026d3;border-radius:8px;background:#fff;color:#86198f;font-weight:600;cursor:pointer}
#pg005-activity .pg5-btn.hidden{display:none}
#pg005-activity .pg5-clear{position:absolute;right:1.2cqw;bottom:1.2cqw;z-index:8;min-height:44px;font-size:14px;font-weight:600;background:#fff;color:#0369a1;border:2px solid #0ea5e9;border-radius:8px;padding:4px 12px;cursor:pointer}
</style>
    <script>
(function () {
  var section = document.getElementById('pg005-activity');
  if (!section || section.dataset.adtInitialized === 'true') return;
  section.dataset.adtInitialized = 'true';

  var svg = section.querySelector('[data-line-layer]');
  var items = Array.prototype.slice.call(section.querySelectorAll('[data-activity-item]'));
  var statusEl = section.querySelector('[data-pair-status]');
  var hintEl = section.querySelector('[data-pair-hint]');
  var retryButton = section.querySelector('[data-retry-button]');
  var clearButton = section.querySelector('[data-clear-lines]');
  var swatches = Array.prototype.slice.call(section.querySelectorAll('.pg5-swatch'));
  var selected = {};
  var paint = swatches.length ? swatches[0].dataset.paintColor : '#ef4444';

  function say(text) { if (statusEl) { statusEl.textContent = text; statusEl.style.color = '#b91c1c'; } }
  function byId(id) { return section.querySelector('[data-activity-item="' + id + '"]'); }
  function canvasOf(item) { return item.querySelector('canvas.pg5-canvas'); }

  function clearFeedback(item) {
    var fb = item.querySelector('.pg5-fb');
    if (fb) { fb.className = 'pg5-fb'; fb.innerHTML = ''; }
  }
  function setFeedback(item, ok) {
    var fb = item.querySelector('.pg5-fb');
    if (!fb) return;
    fb.className = 'pg5-fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = ok
      ? '<i class="fas fa-check-circle" aria-hidden="true"></i>'
      : '<i class="fas fa-times-circle" aria-hidden="true"></i>';
  }

  function redraw() {
    svg.innerHTML = '';
    var drawn = {};
    items.forEach(function (item) {
      var pid = item.dataset.pairedWith;
      if (!pid) return;
      var key = [item.dataset.activityItem, pid].sort().join('|');
      if (drawn[key]) return;
      drawn[key] = true;
      var partner = byId(pid);
      if (!partner) return;
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', 'M ' + item.dataset.cx + ',' + item.dataset.cy + ' L ' + partner.dataset.cx + ',' + partner.dataset.cy);
      if (item.dataset.wrongPair === 'true') p.setAttribute('class', 'is-wrong');
      svg.appendChild(p);
    });
    if (clearButton) {
      var any = items.some(function (i) { return i.dataset.round === clearButton.dataset.clearLines && i.dataset.pairedWith; });
      clearButton.disabled = !any;
      clearButton.style.opacity = any ? '1' : '.5';
    }
  }

  function setSelected(item, on) {
    item.classList.toggle('is-selected', on);
    item.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function clearSelection(round) {
    if (selected[round]) { setSelected(selected[round], false); selected[round] = null; }
  }
  function unpairOne(item) {
    delete item.dataset.pairedWith;
    delete item.dataset.wrongPair;
    item.classList.remove('is-paired');
    clearFeedback(item);
  }
  function unpair(item) {
    var partner = item.dataset.pairedWith ? byId(item.dataset.pairedWith) : null;
    unpairOne(item);
    if (partner) unpairOne(partner);
  }
  function pair(a, b) {
    a.dataset.pairedWith = b.dataset.activityItem;
    b.dataset.pairedWith = a.dataset.activityItem;
    a.classList.add('is-paired');
    b.classList.add('is-paired');
  }

  function handlePairClick(item) {
    var round = item.dataset.round;
    if (item.dataset.pairedWith) {
      unpair(item);
      clearSelection(round);
      selected[round] = item;
      setSelected(item, true);
      redraw();
      say('යා කිරීම ඉවත් කළා.');
      return;
    }
    var sel = selected[round];
    if (!sel) {
      selected[round] = item;
      setSelected(item, true);
      say('රූපය තෝරා ගත්තා. දැන් සමාන රූපය ඔබන්න.');
      return;
    }
    if (sel === item) { clearSelection(round); say(''); return; }
    pair(sel, item);
    clearSelection(round);
    redraw();
    say(round === '2' ? 'රූප දෙක යා කළා. දැන් පාට කරන්න.' : 'රූප දෙක යා කළා.');
  }

  // ---- colouring (round 2) ----
  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function isLinePixel(d, i) {
    var o = i * 4;
    if (d[o + 3] < 40) return false;
    return 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2] < 180;
  }
  function computeMask(img) {
    var w = img.width, h = img.height, d = img.data;
    var seen = new Uint8Array(w * h), bg = new Uint8Array(w * h), st = [], x, y;
    for (x = 0; x < w; x++) { st.push(x); st.push((h - 1) * w + x); }
    for (y = 0; y < h; y++) { st.push(y * w); st.push(y * w + w - 1); }
    while (st.length) {
      var i = st.pop();
      if (seen[i]) continue;
      seen[i] = 1;
      if (isLinePixel(d, i)) continue;
      bg[i] = 1;
      var cx = i % w, cy = (i / w) | 0;
      if (cx > 0 && !seen[i - 1]) st.push(i - 1);
      if (cx < w - 1 && !seen[i + 1]) st.push(i + 1);
      if (cy > 0 && !seen[i - w]) st.push(i - w);
      if (cy < h - 1 && !seen[i + w]) st.push(i + w);
    }
    var mask = new Uint8Array(w * h), total = 0;
    for (var j = 0; j < w * h; j++) { if (!isLinePixel(d, j) && !bg[j]) { mask[j] = 1; total++; } }
    return { mask: mask, total: total };
  }
  function floodFill(state, sx, sy, rgb) {
    var w = state.w, h = state.h, s = sy * w + sx;
    if (sx < 0 || sy < 0 || sx >= w || sy >= h || !state.mask[s]) return 0;
    var img = state.ctx.getImageData(0, 0, w, h), d = img.data;
    var o0 = s * 4, t = [d[o0], d[o0 + 1], d[o0 + 2], d[o0 + 3]];
    var st = [s], seen = new Uint8Array(w * h), added = 0;
    while (st.length) {
      var i = st.pop();
      if (seen[i]) continue;
      seen[i] = 1;
      if (!state.mask[i]) continue;
      var o = i * 4;
      if (Math.abs(d[o] - t[0]) >= 30 || Math.abs(d[o + 1] - t[1]) >= 30 || Math.abs(d[o + 2] - t[2]) >= 30 || Math.abs(d[o + 3] - t[3]) >= 30) continue;
      d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
      if (!state.colored[i]) { state.colored[i] = 1; added++; }
      var cx = i % w, cy = (i / w) | 0;
      if (cx > 0) st.push(i - 1);
      if (cx < w - 1) st.push(i + 1);
      if (cy > 0) st.push(i - w);
      if (cy < h - 1) st.push(i + w);
    }
    state.ctx.putImageData(img, 0, 0);
    state.filled += added;
    return added;
  }
  function fillAll(state, rgb) {
    var img = state.ctx.getImageData(0, 0, state.w, state.h), d = img.data;
    for (var i = 0; i < state.w * state.h; i++) {
      if (!state.mask[i]) continue;
      var o = i * 4;
      d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
      if (!state.colored[i]) { state.colored[i] = 1; state.filled++; }
    }
    state.ctx.putImageData(img, 0, 0);
  }
  function isColored(item) {
    var c = canvasOf(item);
    if (!c) return true;
    var st = c._pg5;
    return !!st && st.total > 0 && st.filled >= st.total * 0.5;
  }

  items.forEach(function (item) {
    item.addEventListener('click', function () { handlePairClick(item); });
    var canvas = canvasOf(item);
    if (!canvas) return;
    var img = new Image();
    img.onload = function () {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var m = computeMask(data);
      canvas._pg5 = { ctx: ctx, w: canvas.width, h: canvas.height, original: data, mask: m.mask, total: m.total, colored: new Uint8Array(canvas.width * canvas.height), filled: 0 };
    };
    img.src = canvas.dataset.src;
    canvas.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!item.dataset.pairedWith) { handlePairClick(item); return; }
      var st = canvas._pg5;
      if (!st) return;
      var r = canvas.getBoundingClientRect();
      var x = Math.floor((e.clientX - r.left) * (st.w / r.width));
      var y = Math.floor((e.clientY - r.top) * (st.h / r.height));
      floodFill(st, x, y, hexToRgb(paint));
    });
  });

  section.querySelectorAll('[data-fill-for]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var item = byId(btn.dataset.fillFor);
      var st = item && canvasOf(item) && canvasOf(item)._pg5;
      if (!item || !st) return;
      if (!item.dataset.pairedWith) { say('මුලින් රූප යා කරන්න.'); return; }
      fillAll(st, hexToRgb(paint));
      say('පාට කළා.');
    });
  });

  swatches.forEach(function (sw) {
    sw.addEventListener('click', function () {
      paint = sw.dataset.paintColor;
      swatches.forEach(function (o) { o.setAttribute('aria-pressed', o === sw ? 'true' : 'false'); });
    });
  });

  if (clearButton) {
    clearButton.addEventListener('click', function () {
      var round = clearButton.dataset.clearLines;
      items.forEach(function (i) { if (i.dataset.round === round) { unpairOne(i); } });
      clearSelection(round);
      redraw();
      say('යා කිරීම් ඉවත් කළා.');
    });
  }

  function resetActivity() {
    items.forEach(function (item) {
      unpairOne(item);
      setSelected(item, false);
      var c = canvasOf(item);
      if (c && c._pg5) { c._pg5.ctx.putImageData(c._pg5.original, 0, 0); c._pg5.colored.fill(0); c._pg5.filled = 0; }
    });
    selected = {};
    paint = swatches.length ? swatches[0].dataset.paintColor : paint;
    swatches.forEach(function (o, i) { o.setAttribute('aria-pressed', i === 0 ? 'true' : 'false'); });
    redraw();
    if (statusEl) { statusEl.textContent = ''; }
    if (retryButton) retryButton.classList.add('hidden');
  }

  function validate() {
    var missing = false, wrong = false, uncolored = false;
    items.forEach(function (item) {
      if (!item.dataset.pairedWith) { missing = true; return; }
      var partner = byId(item.dataset.pairedWith);
      var ok = !!partner && partner.dataset.pairId === item.dataset.pairId;
      item.dataset.wrongPair = ok ? '' : 'true';
      setFeedback(item, ok);
      if (!ok) { wrong = true; return; }
      if (item.dataset.round === '2' && !isColored(item)) uncolored = true;
    });
    redraw();
    if (wrong) { say('තව උත්සාහ කරන්න. සමාන රූප යා කරන්න.'); if (retryButton) retryButton.classList.remove('hidden'); return false; }
    if (missing) { say('සියලු රූප යා කරන්න.'); if (retryButton) retryButton.classList.add('hidden'); return false; }
    if (uncolored) { say('නිවැරදියි! දැන් යා කළ රූප පාට කරන්න.'); if (retryButton) retryButton.classList.add('hidden'); return false; }
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
    return true;
  }

  if (retryButton) {
    retryButton.addEventListener('click', function () {
      resetActivity();
      window.dispatchEvent(new CustomEvent('adt:activityReset', { detail: { section: section, sectionId: 'pg005_sec001', reset: true, unsolved: true } }));
    });
  }

  var handlers = { validate: validate, reset: resetActivity };
  if (typeof window.adtRegisterCustomActivity === 'function') {
    window.adtRegisterCustomActivity(section, handlers);
  } else {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (typeof window.adtRegisterCustomActivity === 'function') { clearInterval(timer); window.adtRegisterCustomActivity(section, handlers); }
      else if (tries >= 30) clearInterval(timer);
    }, 100);
  }
  redraw();
})();

    </script>
  </section>
</div>
