    <script>
(function () {
  var section = document.getElementById('pg007-activity');
  if (!section || section.dataset.adtInitialized === 'true') return;
  section.dataset.adtInitialized = 'true';

  var svg = section.querySelector('[data-line-layer]');
  var flowers = Array.prototype.slice.call(section.querySelectorAll('[data-kind="flower"]'));
  var trees = Array.prototype.slice.call(section.querySelectorAll('[data-kind="tree"]'));
  var bees = Array.prototype.slice.call(section.querySelectorAll('[data-kind="bee"]'));
  var canvases = Array.prototype.slice.call(section.querySelectorAll('canvas.pg7-canvas'));
  var swatches = Array.prototype.slice.call(section.querySelectorAll('.pg7-swatch'));
  var statusEl = section.querySelector('[data-pair-status]');
  var retryButton = section.querySelector('[data-retry-button]');
  var selected = null;
  var paint = swatches.length ? { hex: swatches[0].dataset.paintColor, key: swatches[0].dataset.colorKey } : { hex: '#25a9e1', key: 'blue' };

  function say(text) { if (statusEl) { statusEl.textContent = text; statusEl.style.color = '#b91c1c'; } }
  function treeById(id) { return section.querySelector('[data-kind="tree"][data-tree-id="' + id + '"]'); }

  function clearFeedback(item) {
    var fb = item.querySelector('.pg7-fb');
    if (fb) { fb.className = 'pg7-fb'; fb.innerHTML = ''; }
  }
  function setFeedback(item, ok) {
    var fb = item.querySelector('.pg7-fb');
    if (!fb) return;
    fb.className = 'pg7-fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = ok
      ? '<i class="fas fa-check-circle" aria-hidden="true"></i>'
      : '<i class="fas fa-times-circle" aria-hidden="true"></i>';
  }

  // ---- activity 4: flowers -> trees ----
  function redraw() {
    svg.innerHTML = '';
    flowers.forEach(function (f) {
      var t = f.dataset.pairedWith ? treeById(f.dataset.pairedWith) : null;
      if (!t) return;
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', 'M ' + f.dataset.cx + ',' + f.dataset.cy + ' L ' + t.dataset.ax + ',' + t.dataset.ay);
      if (f.dataset.wrongPair === 'true') p.setAttribute('class', 'is-wrong');
      svg.appendChild(p);
    });
  }
  function setSelected(item, on) {
    item.classList.toggle('is-selected', on);
    item.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function clearSelection() { if (selected) { setSelected(selected, false); selected = null; } }
  function disconnect(f) {
    delete f.dataset.pairedWith;
    delete f.dataset.wrongPair;
    f.classList.remove('is-paired');
    clearFeedback(f);
  }
  function connect(f, t) {
    disconnect(f);
    f.dataset.pairedWith = t.dataset.treeId;
    f.classList.add('is-paired');
    redraw();
    say('මල ගසට යා කළා.');
  }
  function handleClick(item) {
    var isFlower = item.dataset.kind === 'flower';
    if (isFlower && item.dataset.pairedWith) {
      disconnect(item);
      clearSelection();
      selected = item;
      setSelected(item, true);
      redraw();
      say('යා කිරීම ඉවත් කළා.');
      return;
    }
    if (!selected) {
      selected = item;
      setSelected(item, true);
      say(isFlower ? 'මල තෝරා ගත්තා. දැන් අයිති ගස ඔබන්න.' : 'ගස තෝරා ගත්තා. දැන් මලක් ඔබන්න.');
      return;
    }
    if (selected === item) { clearSelection(); say(''); return; }
    if (selected.dataset.kind === item.dataset.kind) {
      setSelected(selected, false);
      selected = item;
      setSelected(item, true);
      return;
    }
    var f = isFlower ? item : selected;
    var t = isFlower ? selected : item;
    clearSelection();
    connect(f, t);
  }
  flowers.concat(trees).forEach(function (item) {
    item.addEventListener('click', function () { handleClick(item); });
  });

  // ---- activity 5: paint the bee in its flower's colour ----
  function isLinePixel(d, i) {
    var o = i * 4;
    if (d[o + 3] < 40) return false;
    return 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2] < 180;
  }
  function computeMask(img) {
    var w = img.width, h = img.height, d = img.data;
    var seen = new Uint8Array(w * h), bg = new Uint8Array(w * h), st = [], x, y;
    for (x = 0; x < w; x++) { st.push(x); st.push((h - 1) * w + x); }
    for (y = 0; y < h; y++) { st.push(y * w); st.push(y * w + w - 1); }
    while (st.length) {
      var i = st.pop();
      if (seen[i]) continue;
      seen[i] = 1;
      if (isLinePixel(d, i)) continue;
      bg[i] = 1;
      var cx = i % w, cy = (i / w) | 0;
      if (cx > 0 && !seen[i - 1]) st.push(i - 1);
      if (cx < w - 1 && !seen[i + 1]) st.push(i + 1);
      if (cy > 0 && !seen[i - w]) st.push(i - w);
      if (cy < h - 1 && !seen[i + w]) st.push(i + w);
    }
    var mask = new Uint8Array(w * h);
    for (var j = 0; j < w * h; j++) { if (!isLinePixel(d, j) && !bg[j]) mask[j] = 1; }
    return mask;
  }
  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  canvases.forEach(function (canvas) {
    var img = new Image();
    img.onload = function () {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      canvas._pg7 = { ctx: ctx, w: canvas.width, h: canvas.height, original: data, mask: computeMask(data) };
    };
    img.src = canvas.dataset.src;
  });
  function paintBee(bee) {
    var canvas = canvases[+bee.dataset.canvas];
    var st = canvas && canvas._pg7;
    if (!st) return;
    var r = bee.dataset.rect.split(',').map(Number);
    var img = st.ctx.getImageData(0, 0, st.w, st.h), d = img.data;
    var rgb = hexToRgb(paint.hex), n = 0;
    for (var y = Math.max(0, r[1]); y < Math.min(st.h, r[3]); y++) {
      for (var x = Math.max(0, r[0]); x < Math.min(st.w, r[2]); x++) {
        var i = y * st.w + x;
        if (!st.mask[i]) continue;
        var o = i * 4;
        d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
        n++;
      }
    }
    st.ctx.putImageData(img, 0, 0);
    if (n < 30) { say('සමනලයා මත නැවත ඔබන්න.'); return; }
    bee.dataset.painted = paint.key;
    bee.classList.add('is-paired');
    delete bee.dataset.wrongPair;
    clearFeedback(bee);
    say('සමනලයා පාට කළා.');
  }
  bees.forEach(function (bee) {
    bee.addEventListener('click', function () { paintBee(bee); });
  });
  swatches.forEach(function (sw) {
    sw.addEventListener('click', function () {
      paint = { hex: sw.dataset.paintColor, key: sw.dataset.colorKey };
      swatches.forEach(function (o) { o.setAttribute('aria-pressed', o === sw ? 'true' : 'false'); });
    });
  });

  function resetActivity() {
    flowers.forEach(function (f) { disconnect(f); setSelected(f, false); });
    trees.forEach(function (t) { setSelected(t, false); });
    selected = null;
    canvases.forEach(function (c) { if (c._pg7) c._pg7.ctx.putImageData(c._pg7.original, 0, 0); });
    bees.forEach(function (b) { delete b.dataset.painted; delete b.dataset.wrongPair; b.classList.remove('is-paired'); clearFeedback(b); });
    paint = swatches.length ? { hex: swatches[0].dataset.paintColor, key: swatches[0].dataset.colorKey } : paint;
    swatches.forEach(function (o, i) { o.setAttribute('aria-pressed', i === 0 ? 'true' : 'false'); });
    redraw();
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
  }

  function validate() {
    var missingFlowers = false, missingBees = false, wrong = false;
    flowers.forEach(function (f) {
      if (!f.dataset.pairedWith) { missingFlowers = true; return; }
      var ok = f.dataset.pairedWith === f.dataset.pairId;
      f.dataset.wrongPair = ok ? '' : 'true';
      setFeedback(f, ok);
      if (!ok) wrong = true;
    });
    bees.forEach(function (b) {
      if (!b.dataset.painted) { missingBees = true; return; }
      var ok = b.dataset.painted === b.dataset.need;
      setFeedback(b, ok);
      if (!ok) wrong = true;
    });
    redraw();
    if (wrong) { say('තව උත්සාහ කරන්න. වැරදි ඒවා නිවැරදි කරන්න.'); if (retryButton) retryButton.classList.remove('hidden'); return false; }
    if (missingFlowers || missingBees) {
      say(missingFlowers && missingBees ? 'සියලු මල් ගසට යා කර සියලු සමනලුන් පාට කරන්න.' : (missingFlowers ? 'සියලු මල් අයිති ගසට යා කරන්න.' : 'සියලු සමනලුන් පාට කරන්න.'));
      if (retryButton) retryButton.classList.add('hidden');
      return false;
    }
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
    return true;
  }

  if (retryButton) {
    retryButton.addEventListener('click', function () {
      resetActivity();
      window.dispatchEvent(new CustomEvent('adt:activityReset', { detail: { section: section, sectionId: 'pg007_sec001', reset: true, unsolved: true } }));
    });
  }

  var handlers = { validate: validate, reset: resetActivity };
  if (typeof window.adtRegisterCustomActivity === 'function') {
    window.adtRegisterCustomActivity(section, handlers);
  } else {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (typeof window.adtRegisterCustomActivity === 'function') { clearInterval(timer); window.adtRegisterCustomActivity(section, handlers); }
      else if (tries >= 30) clearInterval(timer);
    }, 100);
  }
  redraw();
})();

    </script>
  </section>
