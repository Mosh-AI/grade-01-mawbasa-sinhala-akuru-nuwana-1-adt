    <script>
(function () {
  var section = document.getElementById('pg017-activity');
  if (!section || section.dataset.adtInitialized === 'true') return;
  section.dataset.adtInitialized = 'true';

  var girls = Array.prototype.slice.call(section.querySelectorAll('[data-kind="girl"]'));
  var petals = Array.prototype.slice.call(section.querySelectorAll('[data-kind="petal"]'));
  var badges = Array.prototype.slice.call(section.querySelectorAll('[data-flower-badge]'));
  var canvases = Array.prototype.slice.call(section.querySelectorAll('canvas.pg17-canvas'));
  var swatches = Array.prototype.slice.call(section.querySelectorAll('.pg17-swatch'));
  var statusEl = section.querySelector('[data-pair-status]');
  var retryButton = section.querySelector('[data-retry-button]');
  var keyList = swatches.map(function (s) { return s.dataset.colorKey; });
  var paint = swatches.length ? { hex: swatches[0].dataset.paintColor, key: swatches[0].dataset.colorKey } : { hex: '#ed1c24', key: 'red' };

  function say(text) { if (statusEl) { statusEl.textContent = text; statusEl.style.color = '#b91c1c'; } }
  function clearFb(el) {
    var fb = el.classList && el.classList.contains('pg17-fb') ? el : el.querySelector('.pg17-fb');
    if (fb) { fb.className = 'pg17-fb'; fb.innerHTML = ''; }
  }
  function setFb(el, ok) {
    var fb = el.classList && el.classList.contains('pg17-fb') ? el : el.querySelector('.pg17-fb');
    if (!fb) return;
    fb.className = 'pg17-fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = ok
      ? '<i class="fas fa-check-circle" aria-hidden="true"></i>'
      : '<i class="fas fa-times-circle" aria-hidden="true"></i>';
  }

  function isLinePixel(d, i) {
    var o = i * 4;
    if (d[o + 3] < 40) return false;
    return 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2] < 180;
  }
  function computeMask(img) {
    var w = img.width, h = img.height, d = img.data;
    var seen = new Uint8Array(w * h), bg = new Uint8Array(w * h), st = [], x, y;
    for (x = 0; x < w; x++) { st.push(x); st.push((h - 1) * w + x); }
    for (y = 0; y < h; y++) { st.push(y * w); st.push(y * w + w - 1); }
    while (st.length) {
      var i = st.pop();
      if (seen[i]) continue;
      seen[i] = 1;
      if (isLinePixel(d, i)) continue;
      bg[i] = 1;
      var cx = i % w, cy = (i / w) | 0;
      if (cx > 0 && !seen[i - 1]) st.push(i - 1);
      if (cx < w - 1 && !seen[i + 1]) st.push(i + 1);
      if (cy > 0 && !seen[i - w]) st.push(i - w);
      if (cy < h - 1 && !seen[i + w]) st.push(i + w);
    }
    var mask = new Uint8Array(w * h), total = 0;
    for (var j = 0; j < w * h; j++) { if (!isLinePixel(d, j) && !bg[j]) { mask[j] = 1; total++; } }
    return { mask: mask, total: total };
  }
  function bigRegions(mask, w, h, min) {
    var lab = new Uint8Array(w * h), big = new Uint8Array(w * h);
    for (var s = 0; s < w * h; s++) {
      if (!mask[s] || lab[s]) continue;
      var st = [s], comp = [];
      lab[s] = 1;
      while (st.length) {
        var i = st.pop();
        comp.push(i);
        var cx = i % w, cy = (i / w) | 0, nb = [];
        if (cx > 0) nb.push(i - 1);
        if (cx < w - 1) nb.push(i + 1);
        if (cy > 0) nb.push(i - w);
        if (cy < h - 1) nb.push(i + w);
        for (var q = 0; q < nb.length; q++) { if (mask[nb[q]] && !lab[nb[q]]) { lab[nb[q]] = 1; st.push(nb[q]); } }
      }
      if (comp.length >= min) { for (var z = 0; z < comp.length; z++) big[comp[z]] = 1; }
    }
    return big;
  }
  function snapMask(st, s) {
    if (st.mask[s]) return s;
    var x0 = s % st.w, y0 = (s / st.w) | 0;
    for (var r = 1; r <= 8; r++) {
      for (var dy = -r; dy <= r; dy++) for (var dx = -r; dx <= r; dx++) {
        var x = x0 + dx, y = y0 + dy;
        if (x >= 0 && y >= 0 && x < st.w && y < st.h && st.mask[y * st.w + x]) return y * st.w + x;
      }
    }
    return -1;
  }
  function regionAt(st, s) {
    s = snapMask(st, s);
    if (s < 0) return [];
    var out = [], seen = new Uint8Array(st.w * st.h), stack = [s];
    seen[s] = 1;
    while (stack.length) {
      var i = stack.pop();
      out.push(i);
      var cx = i % st.w, cy = (i / st.w) | 0, nb = [];
      if (cx > 0) nb.push(i - 1);
      if (cx < st.w - 1) nb.push(i + 1);
      if (cy > 0) nb.push(i - st.w);
      if (cy < st.h - 1) nb.push(i + st.w);
      for (var q = 0; q < nb.length; q++) { if (st.mask[nb[q]] && !seen[nb[q]]) { seen[nb[q]] = 1; stack.push(nb[q]); } }
    }
    return out;
  }
  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  var pending = canvases.length;
  canvases.forEach(function (canvas) {
    var c = canvas.dataset.crop.split(',').map(Number);
    var img = new Image();
    img.onload = function () {
      canvas.width = c[2];
      canvas.height = c[3];
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, c[0], c[1], c[2], c[3], 0, 0, c[2], c[3]);
      var data = ctx.getImageData(0, 0, c[2], c[3]);
      var m = computeMask(data);
      canvas._pg17 = { ctx: ctx, w: c[2], h: c[3], original: data, mask: m.mask, big: bigRegions(m.mask, c[2], c[3], 120), total: m.total, idx: new Uint8Array(c[2] * c[3]) };
      pending--;
      if (pending === 0) {
        petals.forEach(function (p) {
          var st = canvases[+p.dataset.canvas]._pg17, pr = p.dataset.probe.split(',').map(Number);
          p._region = regionAt(st, pr[1] * st.w + pr[0]);
        });
      }
    };
    img.src = canvas.dataset.src;
  });
  function stateOf(el) { var cv = canvases[+el.dataset.canvas]; return cv && cv._pg17; }
  function keyIndex() { return paint.key === 'erase' ? 0 : keyList.indexOf(paint.key) + 1; }
  function applyPixel(st, d, o, i, rgb, ki) {
    if (paint.key === 'erase') {
      var od = st.original.data;
      d[o] = od[o]; d[o + 1] = od[o + 1]; d[o + 2] = od[o + 2]; d[o + 3] = od[o + 3];
    } else {
      d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
    }
    st.idx[i] = ki;
  }
  function floodFill(st, sx, sy) {
    var w = st.w, h = st.h, s = sy * w + sx;
    if (sx < 0 || sy < 0 || sx >= w || sy >= h || !st.mask[s]) return 0;
    var img = st.ctx.getImageData(0, 0, w, h), d = img.data, rgb = hexToRgb(paint.hex), ki = keyIndex();
    var o0 = s * 4, t = [d[o0], d[o0 + 1], d[o0 + 2]];
    var stack = [s], seen = new Uint8Array(w * h), n = 0;
    while (stack.length) {
      var i = stack.pop();
      if (seen[i]) continue;
      seen[i] = 1;
      if (!st.mask[i]) continue;
      var o = i * 4;
      if (Math.abs(d[o] - t[0]) >= 30 || Math.abs(d[o + 1] - t[1]) >= 30 || Math.abs(d[o + 2] - t[2]) >= 30) continue;
      applyPixel(st, d, o, i, rgb, ki);
      n++;
      var cx = i % w, cy = (i / w) | 0;
      if (cx > 0) stack.push(i - 1);
      if (cx < w - 1) stack.push(i + 1);
      if (cy > 0) stack.push(i - w);
      if (cy < h - 1) stack.push(i + w);
    }
    st.ctx.putImageData(img, 0, 0);
    return n;
  }
  function fillPixels(st, list) {
    var img = st.ctx.getImageData(0, 0, st.w, st.h), d = img.data, rgb = hexToRgb(paint.hex), ki = keyIndex();
    for (var k = 0; k < list.length; k++) applyPixel(st, d, list[k] * 4, list[k], rgb, ki);
    st.ctx.putImageData(img, 0, 0);
  }
  function fillAll(st) {
    var list = [];
    for (var i = 0; i < st.w * st.h; i++) if (st.big[i]) list.push(i);
    fillPixels(st, list);
  }
  function tapAt(el, ev, keyboardFill) {
    var st = stateOf(el);
    if (!st) return;
    if (ev.detail === 0) { keyboardFill(st); say(paint.key === 'erase' ? 'මකා දැමුවා.' : 'පාට කළා.'); return; }
    var cv = canvases[+el.dataset.canvas], r = cv.getBoundingClientRect();
    var x = Math.floor((ev.clientX - r.left) * (st.w / r.width));
    var y = Math.floor((ev.clientY - r.top) * (st.h / r.height));
    var n = floodFill(st, x, y);
    say(n ? (paint.key === 'erase' ? 'මකා දැමුවා.' : 'පාට කළා.') : 'රූපයේ කොටසක් මත ඔබන්න.');
  }
  girls.forEach(function (g) {
    g.addEventListener('click', function (ev) { clearFb(g); tapAt(g, ev, fillAll); });
  });
  petals.forEach(function (p) {
    p.addEventListener('click', function (ev) {
      var fl = badges[+p.dataset.flower];
      if (fl) clearFb(fl);
      var st = stateOf(p);
      if (!st) return;
      if (ev.detail === 0) { if (p._region) fillPixels(st, p._region); say(paint.key === 'erase' ? 'මකා දැමුවා.' : 'පාට කළා.'); return; }
      var cv = canvases[+p.dataset.canvas], r = cv.getBoundingClientRect();
      var x = Math.floor((ev.clientX - r.left) * (st.w / r.width));
      var y = Math.floor((ev.clientY - r.top) * (st.h / r.height));
      if (x < 0 || y < 0 || x >= st.w || y >= st.h) { say('පෙත්තක් මත ඔබන්න.'); return; }
      var reg = regionAt(st, y * st.w + x);
      if (!reg.length) { say('පෙත්තක් මත ඔබන්න.'); return; }
      fillPixels(st, reg);
      say(paint.key === 'erase' ? 'මකා දැමුවා.' : 'පාට කළා.');
    });
  });
  swatches.forEach(function (sw) {
    sw.addEventListener('click', function () {
      paint = { hex: sw.dataset.paintColor, key: sw.dataset.colorKey };
      swatches.forEach(function (o) { o.setAttribute('aria-pressed', o === sw ? 'true' : 'false'); });
    });
  });

  function girlFraction(g) {
    var st = stateOf(g);
    if (!st || !st.total) return 0;
    var n = 0;
    for (var i = 0; i < st.idx.length; i++) if (st.idx[i]) n++;
    return n / st.total;
  }
  function petalInfo(p) {
    var st = stateOf(p);
    if (!st || !p._region || !p._region.length) return { frac: 0, key: 0 };
    var counts = {}, painted = 0;
    for (var i = 0; i < p._region.length; i++) {
      var k = st.idx[p._region[i]];
      if (k) { painted++; counts[k] = (counts[k] || 0) + 1; }
    }
    var best = 0, bestN = 0;
    Object.keys(counts).forEach(function (k) { if (counts[k] > bestN) { bestN = counts[k]; best = +k; } });
    return { frac: painted / p._region.length, key: best };
  }

  function resetActivity() {
    canvases.forEach(function (c) { if (c._pg17) { c._pg17.ctx.putImageData(c._pg17.original, 0, 0); c._pg17.idx.fill(0); } });
    girls.forEach(clearFb);
    badges.forEach(clearFb);
    paint = swatches.length ? { hex: swatches[0].dataset.paintColor, key: swatches[0].dataset.colorKey } : paint;
    swatches.forEach(function (o, i) { o.setAttribute('aria-pressed', i === 0 ? 'true' : 'false'); });
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
  }

  function validate() {
    var wrong = false, missing = false;
    girls.forEach(function (g) {
      var right = g.dataset.correct === 'true', f = girlFraction(g);
      if (right) { if (f >= 0.15) setFb(g, true); else { clearFb(g); missing = true; } }
      else if (f >= 0.1) { setFb(g, false); wrong = true; }
      else clearFb(g);
    });
    badges.forEach(function (badge, fi) {
      var group = petals.filter(function (p) { return +p.dataset.flower === fi && p.dataset.group === 'same'; });
      var odd = petals.filter(function (p) { return +p.dataset.flower === fi && p.dataset.group === 'odd'; })[0];
      var infos = group.map(petalInfo);
      var allPainted = infos.every(function (x) { return x.frac >= 0.6; });
      if (!allPainted) { clearFb(badge); missing = true; return; }
      var first = infos[0].key;
      var same = infos.every(function (x) { return x.key === first; });
      var oi = odd ? petalInfo(odd) : { frac: 0, key: 0 };
      var oddClash = oi.frac >= 0.3 && oi.key === first;
      if (same && !oddClash) setFb(badge, true); else { setFb(badge, false); wrong = true; }
    });
    if (wrong) { say('වැරදි ඇත. එක වගේ රූප එකම පාටින් පාට කර, වෙනස් එක වෙනත් පාටකින් පාට කරන්න. නැවත උත්සාහ කරන්න.'); if (retryButton) retryButton.classList.remove('hidden'); return false; }
    if (missing) { say('19: හරි ළමයා පාට කරන්න. 20: සෑම මලකම එක වගේ පෙති තුන එකම පාටින් පාට කරන්න.'); if (retryButton) retryButton.classList.add('hidden'); return false; }
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
    return true;
  }

  if (retryButton) {
    retryButton.addEventListener('click', function () {
      resetActivity();
      window.dispatchEvent(new CustomEvent('adt:activityReset', { detail: { section: section, sectionId: 'pg017_sec001', reset: true, unsolved: true } }));
    });
