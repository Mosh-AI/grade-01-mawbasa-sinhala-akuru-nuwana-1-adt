#pg008-activity .pg8-tools{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}

#pg008-activity .pg8-btn{min-height:44px;padding:8px 16px;border:2px solid #c026d3;border-radius:8px;background:#fff;color:#86198f;font-weight:600;cursor:pointer}
#pg008-activity .pg8-btn.hidden{display:none}
</style>
    <script>
(function () {
  var section = document.getElementById('pg008-activity');
  if (!section || section.dataset.adtInitialized === 'true') return;
  section.dataset.adtInitialized = 'true';

  var svg = section.querySelector('[data-line-layer]');
  var pairItems = Array.prototype.slice.call(section.querySelectorAll('[data-side]'));
  var objs = Array.prototype.slice.call(section.querySelectorAll('[data-kind="obj"]'));
  var canvases = Array.prototype.slice.call(section.querySelectorAll('canvas.pg8-canvas'));
  var swatches = Array.prototype.slice.call(section.querySelectorAll('.pg8-swatch'));
  var statusEl = section.querySelector('[data-pair-status]');
  var retryButton = section.querySelector('[data-retry-button]');
  var selected = null;
  var keyList = swatches.map(function (s) { return s.dataset.colorKey; });
  var paint = swatches.length ? { hex: swatches[0].dataset.paintColor, key: swatches[0].dataset.colorKey } : { hex: '#ed1c24', key: 'red' };

  function say(text) { if (statusEl) { statusEl.textContent = text; statusEl.style.color = '#b91c1c'; } }
  function byId(id) { return section.querySelector('[data-activity-item="' + id + '"]'); }
  function clearFeedback(item) {
    var fb = item.querySelector('.pg8-fb');
    if (fb) { fb.className = 'pg8-fb'; fb.innerHTML = ''; }
  }
  function setFeedback(item, ok) {
    var fb = item.querySelector('.pg8-fb');
    if (!fb) return;
    fb.className = 'pg8-fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = ok
      ? '<i class="fas fa-check-circle" aria-hidden="true"></i>'
      : '<i class="fas fa-times-circle" aria-hidden="true"></i>';
  }

  // ---- activity 7: child <-> fruit ----
  function redraw() {
    svg.innerHTML = '';
    var drawn = {};
    pairItems.forEach(function (item) {
      var pid = item.dataset.pairedWith;
      if (!pid) return;
      var key = [item.dataset.activityItem, pid].sort().join('|');
      if (drawn[key]) return;
      drawn[key] = true;
      var partner = byId(pid);
      if (!partner) return;
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', 'M ' + item.dataset.cx + ',' + item.dataset.cy + ' L ' + partner.dataset.cx + ',' + partner.dataset.cy);
      if (item.dataset.wrongPair === 'true') p.setAttribute('class', 'is-wrong');
      svg.appendChild(p);
    });
  }
  function setSelected(item, on) {
    item.classList.toggle('is-selected', on);
    item.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function unpairOne(item) {
    delete item.dataset.pairedWith;
    delete item.dataset.wrongPair;
    item.classList.remove('is-paired');
    clearFeedback(item);
  }
  function unpair(item) {
    var partner = item.dataset.pairedWith ? byId(item.dataset.pairedWith) : null;
    unpairOne(item);
    if (partner) unpairOne(partner);
  }
  function handlePairClick(item) {
    if (item.dataset.pairedWith) {
      unpair(item);
      if (selected) setSelected(selected, false);
      selected = item;
      setSelected(item, true);
      redraw();
      say('යා කිරීම ඉවත් කළා.');
      return;
    }
    if (!selected) {
      selected = item;
      setSelected(item, true);
      say(item.dataset.side === 'a' ? 'ළමයා තෝරා ගත්තා. දැන් ඔහුගේ ඇඳුමේ ඇති පලතුර ඔබන්න.' : 'පලතුර තෝරා ගත්තා. දැන් ඒ පලතුර ඇති ළමයා ඔබන්න.');
      return;
    }
    if (selected === item) { setSelected(item, false); selected = null; say(''); return; }
    if (selected.dataset.side === item.dataset.side) {
      setSelected(selected, false);
      selected = item;
      setSelected(item, true);
      return;
    }
    selected.dataset.pairedWith = item.dataset.activityItem;
    item.dataset.pairedWith = selected.dataset.activityItem;
    selected.classList.add('is-paired');
    item.classList.add('is-paired');
    setSelected(selected, false);
    selected = null;
    redraw();
    say('යා කළා.');
  }
  pairItems.forEach(function (item) {
    item.addEventListener('click', function () { handlePairClick(item); });
  });

  // ---- activity 6: colouring ----
  function isLinePixel(d, i) {
    var o = i * 4;
    if (d[o + 3] < 40) return false;
    return 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2] < 180;
  }
  function computeMask(img) {
    var w = img.width, h = img.height, d = img.data;
    var seen = new Uint8Array(w * h), bg = new Uint8Array(w * h), st = [], x, y;
    for (x = 0; x < w; x++) { st.push(x); st.push((h - 1) * w + x); }
    for (y = 0; y < h; y++) { st.push(y * w); st.push(y * w + w - 1); }
    while (st.length) {
      var i = st.pop();
      if (seen[i]) continue;
      seen[i] = 1;
      if (isLinePixel(d, i)) continue;
      bg[i] = 1;
      var cx = i % w, cy = (i / w) | 0;
      if (cx > 0 && !seen[i - 1]) st.push(i - 1);
      if (cx < w - 1 && !seen[i + 1]) st.push(i + 1);
      if (cy > 0 && !seen[i - w]) st.push(i - w);
      if (cy < h - 1 && !seen[i + w]) st.push(i + w);
    }
    var mask = new Uint8Array(w * h), total = 0;
    for (var j = 0; j < w * h; j++) { if (!isLinePixel(d, j) && !bg[j]) { mask[j] = 1; total++; } }
    return { mask: mask, total: total };
  }
  function bigRegions(mask, w, h, min) {
    var lab = new Uint8Array(w * h), big = new Uint8Array(w * h);
    for (var s = 0; s < w * h; s++) {
      if (!mask[s] || lab[s]) continue;
      var st = [s], comp = [];
      lab[s] = 1;
      while (st.length) {
        var i = st.pop();
        comp.push(i);
        var cx = i % w, cy = (i / w) | 0, nb = [];
        if (cx > 0) nb.push(i - 1);
        if (cx < w - 1) nb.push(i + 1);
        if (cy > 0) nb.push(i - w);
        if (cy < h - 1) nb.push(i + w);
        for (var q = 0; q < nb.length; q++) { if (mask[nb[q]] && !lab[nb[q]]) { lab[nb[q]] = 1; st.push(nb[q]); } }
      }
      if (comp.length >= min) { for (var z = 0; z < comp.length; z++) big[comp[z]] = 1; }
    }
    return big;
  }
  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  canvases.forEach(function (canvas) {
    var c = canvas.dataset.crop.split(',').map(Number);
    var img = new Image();
    img.onload = function () {
      canvas.width = c[2];
      canvas.height = c[3];
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, c[0], c[1], c[2], c[3], 0, 0, c[2], c[3]);
      var data = ctx.getImageData(0, 0, c[2], c[3]);
      var m = computeMask(data);
      canvas._pg8 = { ctx: ctx, w: c[2], h: c[3], original: data, mask: m.mask, big: bigRegions(m.mask, c[2], c[3], 250), total: m.total, idx: new Uint8Array(c[2] * c[3]) };
    };
    img.src = canvas.dataset.src;
  });
  function stateOf(obj) { var cv = canvases[+obj.dataset.canvas]; return cv && cv._pg8; }
  function keyIndex() { return keyList.indexOf(paint.key) + 1; }
  function floodFill(st, sx, sy) {
    var w = st.w, h = st.h, s = sy * w + sx;
    if (sx < 0 || sy < 0 || sx >= w || sy >= h || !st.mask[s]) return 0;
    var img = st.ctx.getImageData(0, 0, w, h), d = img.data, rgb = hexToRgb(paint.hex), ki = keyIndex();
    var o0 = s * 4, t = [d[o0], d[o0 + 1], d[o0 + 2]];
    var stack = [s], seen = new Uint8Array(w * h), n = 0;
    while (stack.length) {
      var i = stack.pop();
      if (seen[i]) continue;
      seen[i] = 1;
      if (!st.mask[i]) continue;
      var o = i * 4;
      if (Math.abs(d[o] - t[0]) >= 30 || Math.abs(d[o + 1] - t[1]) >= 30 || Math.abs(d[o + 2] - t[2]) >= 30) continue;
      d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
      st.idx[i] = ki;
      n++;
      var cx = i % w, cy = (i / w) | 0;
      if (cx > 0) stack.push(i - 1);
      if (cx < w - 1) stack.push(i + 1);
      if (cy > 0) stack.push(i - w);
      if (cy < h - 1) stack.push(i + w);
    }
    st.ctx.putImageData(img, 0, 0);
    return n;
  }
  function fillAll(st) {
    var img = st.ctx.getImageData(0, 0, st.w, st.h), d = img.data, rgb = hexToRgb(paint.hex), ki = keyIndex();
    for (var i = 0; i < st.w * st.h; i++) {
      if (!st.big[i]) continue;
      var o = i * 4;
      d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
      st.idx[i] = ki;
    }
    st.ctx.putImageData(img, 0, 0);
  }
  function paintObj(obj, ev) {
    var st = stateOf(obj);
    if (!st) return;
    clearFeedback(obj);
    if (ev.detail === 0) { fillAll(st); say('පාට කළා.'); return; }
    var cv = canvases[+obj.dataset.canvas], r = cv.getBoundingClientRect();
    var x = Math.floor((ev.clientX - r.left) * (st.w / r.width));
    var y = Math.floor((ev.clientY - r.top) * (st.h / r.height));
    var n = floodFill(st, x, y);
    say(n ? 'පාට කළා.' : 'රූපයේ කොටසක් මත ඔබන්න.');
  }
  objs.forEach(function (obj) {
    obj.addEventListener('click', function (ev) { paintObj(obj, ev); });
  });
  swatches.forEach(function (sw) {
    sw.addEventListener('click', function () {
      paint = { hex: sw.dataset.paintColor, key: sw.dataset.colorKey };
      swatches.forEach(function (o) { o.setAttribute('aria-pressed', o === sw ? 'true' : 'false'); });
    });
  });
  function objStatus(obj) {
    var st = stateOf(obj);
    if (!st || !st.total) return 'missing';
    var counts = {}, others = 0, needCount = 0;
    var ni = keyList.indexOf(obj.dataset.need) + 1;
    for (var i = 0; i < st.idx.length; i++) {
      var k = st.idx[i];
      if (!k) continue;
      if (k === ni) needCount++; else others++;
    }
    if (others > st.total * 0.12) return 'wrong';
    if (needCount >= st.total * 0.55) return 'ok';
    return 'missing';
  }

  function resetActivity() {
    pairItems.forEach(function (i) { unpairOne(i); setSelected(i, false); });
    selected = null;
    canvases.forEach(function (c) { if (c._pg8) { c._pg8.ctx.putImageData(c._pg8.original, 0, 0); c._pg8.idx.fill(0); } });
    objs.forEach(function (o) { clearFeedback(o); });
    paint = swatches.length ? { hex: swatches[0].dataset.paintColor, key: swatches[0].dataset.colorKey } : paint;
    swatches.forEach(function (o, i) { o.setAttribute('aria-pressed', i === 0 ? 'true' : 'false'); });
    redraw();
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
  }

  function validate() {
    var missingPairs = false, missingColour = false, wrong = false;
    pairItems.forEach(function (item) {
      if (!item.dataset.pairedWith) { missingPairs = true; return; }
      var partner = byId(item.dataset.pairedWith);
      var ok = !!partner && partner.dataset.pairId === item.dataset.pairId;
      item.dataset.wrongPair = ok ? '' : 'true';
      setFeedback(item, ok);
      if (!ok) wrong = true;
    });
    objs.forEach(function (obj) {
      var s = objStatus(obj);
      if (s === 'missing') { missingColour = true; clearFeedback(obj); return; }
      setFeedback(obj, s === 'ok');
      if (s === 'wrong') wrong = true;
    });
    redraw();
    if (wrong) { say('තව උත්සාහ කරන්න. වැරදි ඒවා නිවැරදි කරන්න.'); if (retryButton) retryButton.classList.remove('hidden'); return false; }
    if (missingPairs || missingColour) {
      say(missingColour && missingPairs ? 'සියලු සමනලුන් සහ මල් පාට කර, සියලු ළමුන් පලතුරට යා කරන්න.' : (missingColour ? 'සියලු සමනලුන් සහ මල් ගැළපෙන පාටින් පාට කරන්න.' : 'සියලු ළමුන් ඔවුන්ගේ පලතුරට යා කරන්න.'));
      if (retryButton) retryButton.classList.add('hidden');
      return false;
    }
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
    return true;
  }

  if (retryButton) {
    retryButton.addEventListener('click', function () {
      resetActivity();
      window.dispatchEvent(new CustomEvent('adt:activityReset', { detail: { section: section, sectionId: 'pg008_sec001', reset: true, unsolved: true } }));
    });
  }

  var handlers = { validate: validate, reset: resetActivity };
  if (typeof window.adtRegisterCustomActivity === 'function') {
    window.adtRegisterCustomActivity(section, handlers);
  } else {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (typeof window.adtRegisterCustomActivity === 'function') { clearInterval(timer); window.adtRegisterCustomActivity(section, handlers); }
      else if (tries >= 30) clearInterval(timer);
    }, 100);
  }
  redraw();
})();

    </script>
  </section>
</div>
