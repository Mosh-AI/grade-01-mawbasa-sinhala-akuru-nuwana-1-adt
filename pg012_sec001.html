    <script>
(function () {
  var section = document.getElementById('pg012-activity');
  if (!section || section.dataset.adtInitialized === 'true') return;
  section.dataset.adtInitialized = 'true';

  var cells = Array.prototype.slice.call(section.querySelectorAll('[data-kind="cell"]'));
  var statusEl = section.querySelector('[data-pair-status]');
  var retryButton = section.querySelector('[data-retry-button]');

  function say(text) { if (statusEl) { statusEl.textContent = text; statusEl.style.color = '#b91c1c'; } }
  function clearFeedback(item) {
    var fb = item.querySelector('.pg12-fb');
    if (fb) { fb.className = 'pg12-fb'; fb.innerHTML = ''; }
  }
  function setFeedback(item, ok) {
    var fb = item.querySelector('.pg12-fb');
    if (!fb) return;
    fb.className = 'pg12-fb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = ok
      ? '<i class="fas fa-check-circle" aria-hidden="true"></i>'
      : '<i class="fas fa-times-circle" aria-hidden="true"></i>';
  }
  function setSelected(cell, on) {
    cell.classList.toggle('is-selected', on);
    cell.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  cells.forEach(function (cell) {
    cell.addEventListener('click', function () {
      var on = !cell.classList.contains('is-selected');
      setSelected(cell, on);
      clearFeedback(cell);
      say(on ? 'යටින් ඉරක් ඇඳුවා.' : 'ඉර ඉවත් කළා.');
    });
  });

  function resetActivity() {
    cells.forEach(function (c) { setSelected(c, false); clearFeedback(c); });
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
  }

  function validate() {
    var wrong = false, missing = false;
    cells.forEach(function (cell) {
      var odd = cell.dataset.odd === 'true', sel = cell.classList.contains('is-selected');
      if (sel) { setFeedback(cell, odd); if (!odd) wrong = true; }
      else { clearFeedback(cell); if (odd) missing = true; }
    });
    if (wrong) { say('වැරදි රූප යටින් ඉර ඇඳ ඇත. නැවත උත්සාහ කරන්න.'); if (retryButton) retryButton.classList.remove('hidden'); return false; }
    if (missing) { say('සෑම පේළියකම දිශාව වෙනස් රූපය සොයා යටින් ඉරක් අඳින්න.'); if (retryButton) retryButton.classList.add('hidden'); return false; }
    if (statusEl) statusEl.textContent = '';
    if (retryButton) retryButton.classList.add('hidden');
    return true;
  }

  if (retryButton) {
    retryButton.addEventListener('click', function () {
      resetActivity();
      window.dispatchEvent(new CustomEvent('adt:activityReset', { detail: { section: section, sectionId: 'pg012_sec001', reset: true, unsolved: true } }));
    });
  }

  var handlers = { validate: validate, reset: resetActivity };
  if (typeof window.adtRegisterCustomActivity === 'function') {
    window.adtRegisterCustomActivity(section, handlers);
  } else {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      if (typeof window.adtRegisterCustomActivity === 'function') { clearInterval(timer); window.adtRegisterCustomActivity(section, handlers); }
      else if (tries >= 30) clearInterval(timer);
    }, 100);
  }
})();

    </script>
  </section>
