  function dot(x, y) { var ctx = styleCtx(); ctx.beginPath(); ctx.arc(x, y, brushPx() / 2, 0, Math.PI * 2); ctx.fill(); applyMask(x, y, x, y); }
  function line(x1, y1, x2, y2) { var ctx = styleCtx(); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); applyMask(x1, y1, x2, y2); }

  function hasPaint() {
    if (!canvas.width || !canvas.height) return false;
    var data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    for (var i = 3; i < data.length; i += 4) { if (data[i] > 128) return true; }
    return false;
  }
  function clearAll() {
    var ctx = canvas.getContext('2d');
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();

    kb = { x: Math.max(12, rect.width / 2), y: Math.max(12, rect.height / 2), drawing: false, init: true };
  }
  function syncState() {
    var done = hasPaint();
    section.dataset.complete = done ? 'true' : 'false';
    section.dataset.correct = done ? 'true' : 'false';
    section.dataset.solved = done ? 'true' : 'false';
    section.dataset.submitted = 'false'; section.dataset.finished = 'false'; section.dataset.next = 'false'; section.dataset.retry = 'false'; section.dataset.attempted = 'false';
  }
  function hardReset() {
    clearAll(); setFeedback(''); syncState();
    window.dispatchEvent(new CustomEvent('adt:activityReset', { detail: { section: section, sectionId: sectionId, reset: true, unsolved: true } }));
  }
  function pointFromEvent(event) {
    var rect = canvas.getBoundingClientRect();
    var src = (event.touches && event.touches[0]) || (event.changedTouches && event.changedTouches[0]) || event;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  }

  resizeCanvas(false);
  var pointer = { x: 0, y: 0, drawing: false };
  var begin = function (x, y) { pointer.drawing = true; pointer.x = x; pointer.y = y; dot(x, y); setFeedback(''); };
  var move = function (x, y) { if (!pointer.drawing) return; line(pointer.x, pointer.y, x, y); pointer.x = x; pointer.y = y; setFeedback(''); };
  var end = function () { pointer.drawing = false; syncState(); };
  canvas.addEventListener('mousedown', function (e) { e.preventDefault(); var p = pointFromEvent(e); begin(p.x, p.y); });
  canvas.addEventListener('mousemove', function (e) { if (!pointer.drawing) return; e.preventDefault(); var p = pointFromEvent(e); move(p.x, p.y); });
  window.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); var p = pointFromEvent(e); begin(p.x, p.y); }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { if (!pointer.drawing) return; e.preventDefault(); var p = pointFromEvent(e); move(p.x, p.y); }, { passive: false });
  canvas.addEventListener('touchend', function (e) { e.preventDefault(); end(); }, { passive: false });
  canvas.addEventListener('touchcancel', function (e) { e.preventDefault(); end(); }, { passive: false });
  canvas.addEventListener('keydown', function (e) {
    var rect = canvas.getBoundingClientRect();
    if (!kb.init) kb = { x: Math.max(12, rect.width / 2), y: Math.max(12, rect.height / 2), drawing: false, init: true };
    var step = e.shiftKey ? 30 : 12, nx = kb.x, ny = kb.y, handled = true;
    if (e.key === 'ArrowLeft') nx = Math.max(0, kb.x - step);
    else if (e.key === 'ArrowRight') nx = Math.min(rect.width, kb.x + step);
    else if (e.key === 'ArrowUp') ny = Math.max(0, kb.y - step);
    else if (e.key === 'ArrowDown') ny = Math.min(rect.height, kb.y + step);
    else if (e.key === ' ' || e.key === 'Enter') { kb.drawing = !kb.drawing; setPen(kb.drawing ? 'පාට කිරීම ආරම්භ විය' : 'පාට කිරීම නතර විය'); dot(kb.x, kb.y); setFeedback(''); syncState(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { hardReset(); }
    else handled = false;
    if (!handled) return;
    e.preventDefault();
    if ((nx !== kb.x || ny !== kb.y) && kb.drawing) { line(kb.x, kb.y, nx, ny); setFeedback(''); syncState(); }
    kb.x = nx; kb.y = ny;
  });
  window.setTimeout(function () { resizeCanvas(true); syncState(); }, 0);
  window.setTimeout(function () { resizeCanvas(true); syncState(); }, 200);

  swatches.forEach(function (sw) {
    sw.addEventListener('click', function () {
      tool.color = sw.dataset.paintColor; tool.erase = false;
      swatches.forEach(function (o) { o.setAttribute('aria-pressed', o === sw ? 'true' : 'false'); });
      if (eraserBtn) eraserBtn.setAttribute('aria-pressed', 'false');
    });
  });
  sizes.forEach(function (b) {
    b.addEventListener('click', function () {
      tool.size = parseFloat(b.dataset.size);
      sizes.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
    });
  });
  if (eraserBtn) eraserBtn.addEventListener('click', function () {
    tool.erase = !tool.erase;
    eraserBtn.setAttribute('aria-pressed', tool.erase ? 'true' : 'false');
    if (tool.erase) swatches.forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
    else swatches.forEach(function (o) { o.setAttribute('aria-pressed', o.dataset.paintColor === tool.color ? 'true' : 'false'); });
  });
  if (resetButton) resetButton.addEventListener('click', function () { hardReset(); });
  window.addEventListener('resize', function () { resizeCanvas(true); syncState(); });

  window.adtRegisterCustomActivity(section, {
    validate: function () {
      if (!hasPaint()) { syncState(); setFeedback('රූපය පාට කර, පසුව ඉදිරිපත් කරන්න.'); return false; }
      setFeedback(''); syncState(); return true;
    },
    reset: function () { hardReset(); }
  });
  syncState();
})();

    </script>
  </section>
