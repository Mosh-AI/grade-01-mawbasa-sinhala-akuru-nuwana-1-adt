(function () {

    var sh = canvas.dataset.shape.split(':'), v = sh[1].split(',').map(Number);
    var W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.beginPath();
    if (sh[0] === 'rect') ctx.rect(v[0] * W, v[1] * H, (v[2] - v[0]) * W, (v[3] - v[1]) * H);

    var ctx = canvas.getContext('2d');
    if (!canvas.width || !canvas.height) return 0;
    var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data, W = canvas.width, H = canvas.height;
    var s = canvas.dataset.shape.split(':'), v = s[1].split(',').map(Number), total = 0, painted = 0, x, y;
    var inside;
    if (s[0] === 'rect') { var x0 = v[0] * W, y0 = v[1] * H, x1 = v[2] * W, y1 = v[3] * H; inside = function (px, py) { return px >= x0 && px < x1 && py >= y0 && py < y1; }; }
    else { var cx = v[0] * W, cy = v[1] * H, r = v[2] * W; inside = function (px, py) { return (px - cx) * (px - cx) + (py - cy) * (py - cy) <= r * r; }; }

    }

  if (resetButton) resetButton.addEventListener('click', function () { hardReset(); });
  window.addEventListener('resize', function () { canvases.forEach(function (c) { resizeCanvas(c, true); }); syncState(); });

  window.adtRegisterCustomActivity(section, {
    validate: function () {
      if (!allDone()) {
        syncState();
        setFeedback('පාට කර, පසුව ඉදිරිපත් කරන්න.');
        return false;
      }
      setFeedback(''); syncState(); return true;
    },
    reset: function () { hardReset(); }
  });
  syncState();
})();

    </script>
